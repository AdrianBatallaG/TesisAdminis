services:
  mysql:
    image: mysql:8.4
    container_name: newadminis-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: newadminis
      MYSQL_USER: newadminis
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: newadminis-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./API:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: newadminis
      DB_USERNAME: newadminis
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: newadminis-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      api:
        condition: service_started

volumes:
  frontend_node_modules:
  mysql_data:
